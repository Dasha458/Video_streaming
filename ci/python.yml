.python-job:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  parallel:
    matrix:
      - SERVICE: backend
      - SERVICE: services/convertor
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip/$SERVICE"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv/$SERVICE"
  before_script:
    - cd $SERVICE
    - uv sync --frozen
  cache:
    key: "$CI_COMMIT_REF_SLUG-$SERVICE" # Unique cache key per service
    paths:
      - .cache/pip
      - .cache/uv


lint-python:
  extends: .python-job
  stage: lint
  script:
    - uv run ruff check . --config pyproject.toml
    - uv run black --check . --config-file pyproject.toml
    - uv run mypy --install-types --non-interactive . --config-file pyproject.toml
    - uv run isort . --settings-path pyproject.toml

test-python:
  extends: .python-job
  stage: test
  script:
    # -m "not integration" excludes tests/integration/ (needs Docker; runs
    # in the dedicated test-integration-python job below instead).
    - uv run pytest \
      -m "not integration" \
      --cov=. \
      --cov-report=term \
      --cov-report=xml:coverage-${SERVICE//\//-}.xml \
      tests/ --junitxml=report-${SERVICE//\//-}.xml
    - uv run pip-audit > audit-${SERVICE//\//-}.json || true
    - uv run pip-licenses --from=mixed --with-authors --with-urls > licenses-${SERVICE//\//-}.json
  artifacts:
    when: always
    paths:
      - $SERVICE/report.xml
      - $SERVICE/coverage.xml
      - $SERVICE/audit.json
      - $SERVICE/licenses.json
    reports:
      junit: $SERVICE/report.xml
      coverage_report:
        coverage_format: cobertura
        path: $SERVICE/coverage.xml
    expire_in: 1 week

# Only backend has tests/integration/ (real-Postgres tests for
# AnalyticsService and the paginate_query() consolidation -- see
# tests/integration/conftest.py for why these aren't mocked). Runs the
# Docker-backed suite that test-python above deliberately excludes.
test-integration-python:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip/backend-integration"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv/backend-integration"
  before_script:
    - cd backend
    - uv sync --frozen
  cache:
    key: "$CI_COMMIT_REF_SLUG-backend-integration"
    paths:
      - .cache/pip
      - .cache/uv
  script:
    # loop-scope flags: the engine/session fixtures in tests/integration/conftest.py
    # are session-scoped (one Testcontainers Postgres for the whole run), so every
    # test's own asyncio loop must be session-scoped too, or asyncpg raises "Future
    # attached to a different loop". See tests/integration/conftest.py for detail.
    - uv run pytest \
      -m integration \
      -o asyncio_default_test_loop_scope=session \
      -o asyncio_default_fixture_loop_scope=session \
      tests/integration/ --junitxml=report-integration.xml
  artifacts:
    when: always
    paths:
      - backend/report-integration.xml
    reports:
      junit: backend/report-integration.xml
    expire_in: 1 week
