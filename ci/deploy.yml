variables:
  REGISTRY: $CI_REGISTRY/$CI_PROJECT_PATH
  TRIVY_VERSION: "0.56.2"

# ---------------- Detect changed services ----------------
detect-changes:
  stage: detect
  image: alpine:latest
  script:
    - apk add --no-cache git
    - echo "Checking changed folders..."
    - |
      # SERVICE:path pairs. SERVICE must match the `deploy` job's matrix
      # names below; path is the repo prefix that job actually builds from.
      for PAIR in backend:backend convertor:services/convertor frontend:frontend; do
        SERVICE="${PAIR%%:*}"
        PATH_PREFIX="${PAIR#*:}"
        if git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -q "^$PATH_PREFIX/"; then
          echo "$SERVICE changed"
          echo "$SERVICE=true" >> changes.env
        else
          echo "$SERVICE=false" >> changes.env
        fi
      done
  artifacts:
    reports:
      dotenv: changes.env

# ---------------- Build & push Docker images ----------------
deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  needs:
    - detect-changes
  parallel:
    matrix:
      - SERVICE: backend
      - SERVICE: convertor
      - SERVICE: frontend
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    # Trivy CLI, installed once per job run regardless of whether this
    # SERVICE actually rebuilds -- cheap, and keeps the script below simple.
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v$TRIVY_VERSION
    - |
      if [ "$SERVICE" = "frontend" ]; then
        PATH_TO_SERVICE="./frontend"
      elif [ "$SERVICE" = "convertor" ]; then
        PATH_TO_SERVICE="./services/convertor"
      else
        PATH_TO_SERVICE="./backend"
      fi
    - |
      if grep -q "^$SERVICE=true" changes.env; then
        IMAGE="$REGISTRY/$SERVICE:$CI_COMMIT_SHA"
        docker build -t $IMAGE $PATH_TO_SERVICE
        # Scan before push: a HIGH/CRITICAL vulnerability with a known fix
        # blocks the push. --ignore-unfixed skips CVEs with no available fix
        # (mostly base-image noise nothing here can act on).
        trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed $IMAGE
        docker push $IMAGE
        docker tag $IMAGE $REGISTRY/$SERVICE:latest
        docker push $REGISTRY/$SERVICE:latest
        echo "✅ Pushed $IMAGE"
      else
        echo "$SERVICE unchanged, skipping build"
      fi
  environment:
    name: stage
