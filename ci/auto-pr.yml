auto-pr-to-stage:
  stage: auto-pr
  image: curlimages/curl:latest
  script:
    # 1. Checkout dev branch
    - git config user.name "CI Bot"
    - git config user.email "ci@example.com"
    - git checkout dev

    # 2. Push dev branch (in case of changes)
    - git push origin dev || echo "No changes to push"

    # 3. Create Merge Request via GitLab API (requires human approval — no auto-merge)
    - |
      MR_RESPONSE=$(curl --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data '{
          "source_branch": "dev",
          "target_branch": "stage",
          "title": "Merge dev into stage (auto MR)",
          "description": "Auto MR after successful CI — requires manual review and approval before merging.",
          "remove_source_branch": false,
          "labels": "auto-pr"
        }')
      echo "Merge Request created: $MR_RESPONSE"

    # NOTE: Auto-merge intentionally disabled — merges to stage must be approved by a human reviewer.
    # To re-enable, restore the PUT .../merge_requests/$MR_ID/merge call below and obtain sign-off.

  only:
    - dev
