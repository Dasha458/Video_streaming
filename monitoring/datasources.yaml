apiVersion: 1

# Grafana will not change the uid of a datasource that already exists --
# it answers "data source not found" and refuses to start. Removing them
# first lets the definitions below be the single source of truth, which
# is the point of provisioning them at all.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: VideoDB
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed so provisioned dashboards can reference it. Without a uid here
    # Grafana generates one per installation, and a dashboard checked into
    # the repository cannot name it.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # The platform's own database, read directly. Metrics answer "is it
  # healthy"; this answers "how many videos were uploaded this week" --
  # and nobody has to write a metric for every question anyone will ask.
  #
  # grafana_ro is a login with SELECT and nothing else (created by
  # Docker/postgres/postgres_entrypoint.sh). The password comes from the
  # environment, so it is not committed here.
  - name: VideoDB
    type: grafana-postgresql-datasource
    uid: videodb
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: ${VIDEO_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    editable: true
