# Alert rules, provisioned from the repository like the dashboards.
#
# Each rule is a PromQL query plus a threshold plus a duration. The
# duration is not decoration: without it a single ten-second spike pages
# somebody, the alerts get muted, and the whole thing stops meaning
# anything. Every rule here has to stay true for minutes.
#
# They are deliberately about symptoms people would notice -- requests
# failing, uploads not playable, storage running out -- rather than about
# causes like high CPU, which is often just a machine doing its job.
#
# Firing alerts appear under Alerting > Alert rules.
#
# Delivery to Telegram is implemented and tested end to end, and is
# currently switched off: grafana-bootstrap generates the contact point
# and the notification policy from TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID in Vault's secret/grafana, and removes them again when
# those are empty -- which they are. Until they are set, these rules are
# visible in Grafana and notify nobody. See monitoring/README.md.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "video-streaming",
      "folder": "Video Streaming",
      "interval": "1m",
      "rules": [
        {
          "uid": "vs-target-down",
          "title": "A monitored service stopped reporting",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.job }} is not being scraped",
            "description": "Prometheus cannot reach this target. Until it comes back every panel about it shows no data, which looks exactly like a service with no problems."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "min by(job) (up)",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-api-5xx",
          "title": "API is returning server errors",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than 5% of API responses are 5xx",
            "description": "The share, not the count: ten errors in a thousand requests and ten in ten are different incidents. Held for five minutes so a single deploy blip does not page."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rate(fastapi_responses_total{status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(fastapi_responses_total[5m])), 0.0001)",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-encode-backlog",
          "title": "Encoding queue is not draining",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than 20 encode jobs are waiting",
            "description": "Uploads are arriving faster than the converter finishes them, or no worker is consuming. Check consumers on the Transcoding board before adding capacity."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "rabbitmq_queue_messages_ready",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        20
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-encode-failures",
          "title": "Encodes are failing",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than three encodes failed in the last 15 minutes",
            "description": "Failed encodes leave a video the uploader can see and nobody can play."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(increase(convertor_encodes_finished_total{outcome=\"failed\"}[15m]))",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        3
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-storage-low",
          "title": "Object storage is filling up",
          "condition": "C",
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Less than 15% of object storage is free",
            "description": "Video is the one thing here that grows without bound. When this runs out, uploads fail and encodes fail with them."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "minio_cluster_capacity_usable_free_bytes / clamp_min(minio_cluster_capacity_usable_total_bytes, 1)",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        0.15
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-db-connections",
          "title": "Postgres connections are climbing",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than 80 Postgres connections are open",
            "description": "Postgres refuses new work past max_connections. A number that climbs and never falls is a pool leak, not load."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(pg_stat_database_numbackends)",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        80
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "vs-redis-evictions",
          "title": "Redis is evicting data",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Redis is dropping keys to stay within its memory limit",
            "description": "Eviction means the cache is now losing data it was asked to keep. Hit ratio falls and the database takes the difference."
          },
          "labels": {
            "service": "video-streaming"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rate(redis_evicted_keys_total[10m]))",
                "instant": true,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
