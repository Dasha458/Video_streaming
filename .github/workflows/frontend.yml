# Lint, typecheck, build and test the SPA.
#
# The typecheck step is the one worth knowing about: `tsc --noEmit` at the
# root checks nothing at all -- the root tsconfig has "files": [] and only
# project references, so it compiles an empty program and exits 0. The real
# check is `tsc -b`, which is what `npm run typecheck` runs.
name: Frontend

on:
  push:
    branches: [main, "dev**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported LTS lines. The GitLab pipeline also listed 21,
        # which reached end of life in June 2024 -- testing against a
        # runtime nobody may deploy buys nothing.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the
      # lockfile and fails if package.json has drifted from it, which is
      # what a check is for.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Reported, not enforced -- see the backend workflow for why.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
