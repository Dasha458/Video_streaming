# DEV ONLY. Mounted into /etc/nginx/dev-locations/ by docker-compose.dev.yml
# and picked up by the `include` at the end of the server block in nginx.conf.
# Never mount this in production: it publishes the Vault HTTP API (/v1/ --
# with a token, every secret), the Vault UI, RabbitMQ management, the MinIO
# console and S3 API, Prometheus, Grafana and Swagger on the public host.
#
# Every upstream below is addressed through a variable ($minio_api and
# friends) so nginx resolves the name per request via the Docker DNS resolver
# declared in nginx.conf. With a literal `proxy_pass http://grafana:3000` the
# name is resolved at config load and the WHOLE gateway refuses to start if
# that one container happens to be down -- which took the app offline while
# only monitoring was stopped.


        # Deferred name resolution -- see the note at the top of this file.
        set $minio_api      http://minio:9000;
        set $minio_console  http://minio:9001;
        set $rabbitmq_mgmt  http://rabbitmq:15672;
        set $grafana        http://grafana:3000;
        set $prometheus     http://prometheus:9090;
        set $vault          http://vault:8200;

        location /docs {
            proxy_pass http://bff_upstream/docs;
        }

        location /openapi.json {
            proxy_pass http://bff_upstream/openapi.json;
        }

        location /minio/ {
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass $minio_api;
            proxy_buffering off;
        }

        location /minio/ui/ {
            rewrite ^/minio/ui/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            real_ip_header X-Real-IP;

            proxy_connect_timeout 300;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            chunked_transfer_encoding off;

            proxy_pass $minio_console;

        }

        location ~* /rabbitmq/api/(.*?)/(.*) {
            proxy_pass $rabbitmq_mgmt/api/$1/%2F/$2?$query_string;
        }

        location ~* /rabbitmq/(.*) {
            rewrite ^/rabbitmq/(.*)$ /$1 break;
            proxy_pass $rabbitmq_mgmt;
        }

        location /grafana/ {
            proxy_pass $grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }

        location /prometheus/ {
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass $prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /rabbitmq {
            rewrite ^/rabbitmq$ /rabbitmq/ permanent;
        }

        location /ui/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;

            proxy_pass $vault$request_uri;
        }

        location /v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_pass $vault$request_uri;
        }
