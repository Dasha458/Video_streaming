# Baseline security headers. Included at server level AND inside every
# location that sets its own add_header, because nginx drops all inherited
# add_header directives the moment a location declares one of its own.
#
# X-XSS-Protection is intentionally absent: the auditor it targets was
# removed from every major browser, and Chrome's implementation was itself
# an XSS vector before removal. CSP (location /) is the replacement.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Ignored by browsers over plain http; becomes active the moment TLS is
# terminated here (open issue N-3). Safe to ship ahead of that.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
