worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/json;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;

    # Rate limiting, keyed by client IP. `auth` covers the credential
    # endpoints (login/register/password reset/check-user): 10 attempts a
    # minute with a burst of 5 is generous for a human and useless for a
    # brute-force. `api` is a sanity cap for everything else under /api/;
    # video/HLS bytes go through /minio/ and are deliberately not limited.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:8001 resolve;
#         server frontend2:8001;
#         server frontend3:8001;
    }

    upstream bff_upstream {
        zone bff_upstream 64k;
        server bff:8000 resolve;
#         server bff2:8000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        http2 on;

        include /etc/nginx/security-headers.conf;

        client_max_body_size 1000m;


        location / {
            include /etc/nginx/security-headers.conf;
            # The SPA loads no inline scripts and no third-party origins.
            # blob: covers hls.js (MediaSource URLs + its web worker);
            # 'unsafe-inline' for styles is required by Radix UI's inline
            # style attributes. Admin UIs under /grafana/, /rabbitmq/,
            # /minio/ui/ are separate locations and get no CSP -- they ship
            # their own inline scripts and would break.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Credential endpoints: tighter limit. Must precede the generic
        # ~ ^/api/ location -- nginx takes the first matching regex.
        location ~ ^/api/auth/(login|register|forgot-password|reset-password|check-user|request-verify)$ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://bff_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/minio/(?!ui/)(?<bucket>[^/]+)/(?<path>.*)$ {
            proxy_buffering off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            auth_request /signer;
            auth_request_set $signed_url $upstream_http_x_signed_url;

            proxy_pass $signed_url;
        }

        location = /signer {
            internal;
            proxy_pass http://bff_upstream/api/files/sign_url?file_path=$request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        location ~ ^/api/(.*?)(/.*)?$ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://bff_upstream/api/$1$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything operational -- Swagger, MinIO console, RabbitMQ
        # management, Grafana, Prometheus, the Vault UI and API -- lives in
        # gateway/dev-admin-locations.conf and is mounted into this directory
        # ONLY by docker-compose.dev.yml. In production the glob matches
        # nothing and none of those routes exist on the public gateway.
        include /etc/nginx/dev-locations/*.conf;
    }
}
