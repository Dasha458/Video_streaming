# Mounted into /etc/nginx/realip/ by docker-compose.prod.yml ONLY.
#
# In that deployment Caddy is the edge: it terminates TLS, sees the real
# client, and sets X-Real-IP to it (gateway/Caddyfile, header_up X-Real-IP
# {remote_host} -- which replaces whatever the client may have sent).
# Without the lines below, nginx's own $remote_addr is Caddy's container
# address, and every visitor looks like the same one to anything that reads
# the client address -- unique-view counting most of all.
#
# The trust list is what keeps this from being a spoofing hole: nginx only
# believes X-Real-IP when the request came from inside the container
# network. In this deployment nginx publishes no host port at all
# (docker-compose.prod.yml sets `ports: !override []`), so Caddy is its only
# possible peer. A request from the internet can never arrive with a private
# source address, so it can never have its X-Real-IP believed.
#
# It is deliberately NOT part of the base config: with no proxy in front,
# nginx's own $remote_addr is already the client, and trusting the header
# would let a direct caller choose their own address.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;

real_ip_header X-Real-IP;
