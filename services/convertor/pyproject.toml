[project]
name = "convertor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore>=2.24.1",
    "faststream[cli,prometheus,rabbit]>=0.5.48",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "hvac>=2.3.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.35.0",
    "uvloop; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    # The lint job runs over this service too, and these were missing from
    # it: `uv sync` installed none of them, so the step could only ever
    # fail on a runner that actually executed it.
    "black>=25.9.0",
    "isort>=6.1.0",
    "jsonschema>=4.23",
    "mypy>=1.18.2",
    "pip-audit>=2.10.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.14.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | alembic
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["alembic", ".venv"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic", ".venv"]
# No `fix = true` -- see the note in backend/pyproject.toml.

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # E/W — pycodestyle, F — pyflakes, I — isort
ignore = ["E501"]  # black owns line wrapping

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
strict_optional = true
explicit_package_bases = true
exclude = "(alembic|.venv)"

# The same exemption the backend already makes: disallow_untyped_defs is
# for the service itself. Annotating several hundred `def test_x():` adds
# no safety and buries the findings in src/ -- there were 91 of them here,
# every one a missing `-> None` on a test.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
